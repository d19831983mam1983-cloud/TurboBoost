name: Check Key
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and list
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > check.jks
          keytool -list -keystore check.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}"
