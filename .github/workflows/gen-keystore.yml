name: Generate Keystore
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=TurboBoost, OU=ZNAK, O=TurboBoost, L=Moscow, S=Moscow, C=RU"
      - name: Encode to base64
        run: base64 -w0 release.jks > keystore.b64
      - name: Print base64 to log
        run: cat keystore.b64
      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.jks
