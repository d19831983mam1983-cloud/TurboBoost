name: Generate Keystore (Temporary)
on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore turboboost-release.jks \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -alias turboboost \
            -storetype JKS \
            -storepass "A7r5t1e2m" \
            -keypass "A7r5t1e2m" \
            -dname "CN=TurboBoost, OU=Dev, O=TurboBoost, L=Moscow, C=RU"

      - name: Encode to Base64 and Print
        run: |
          base64 -w0 turboboost-release.jks > keystore.b64
          echo "====== COPY THE TEXT BELOW THIS LINE ======"
          cat keystore.b64
          echo ""
          echo "====== COPY THE TEXT ABOVE THIS LINE ======"
